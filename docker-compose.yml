networks:
  app_yaya-dev:
    external: true

services:
  yayah-resto-demo:
    image: yayah:latest
    container_name: yayah-resto-demo
    restart: always
    networks:
      - app_yaya-dev
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.resto-demo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "node scripts/migrate.js && node app.js"

  yayah-clinic-demo:
    image: yayah:latest
    container_name: yayah-clinic-demo
    restart: always
    networks:
      - app_yaya-dev
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.clinic-demo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "node scripts/migrate.js && node app.js"

  yayah-telecom-demo:
    image: yayah:latest
    container_name: yayah-telecom-demo
    restart: always
    networks:
      - app_yaya-dev
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - .env.telecom-demo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "node scripts/migrate.js && node app.js"
