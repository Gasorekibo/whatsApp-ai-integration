version: '3.8'

services:
  # Redis - Required for queues and caching
  redis:
    image: redis:7-alpine
    container_name: whatsapp-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_APPENDONLY=yes
    command: redis-server --appendonly yes
    networks:
      - whatsapp-network

  # Main Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-ai-app
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Server
      PORT: 3000
      NODE_ENV: production

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      REDIS_DB: 0

      # Gemini Rate Limiting
      GEMINI_MAX_RPS: 3
      GEMINI_MAX_BURST: 5
      GEMINI_BASE_DELAY: 1000
      GEMINI_MAX_DELAY: 30000
      GEMINI_MAX_RETRIES: 5

      # Workers
      CHAT_WORKER_CONCURRENCY: 5
      WHATSAPP_WORKER_CONCURRENCY: 10

      # Monitoring
      QUEUE_MONITOR_INTERVAL: 30000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - whatsapp-network
    command: sh -c "npx sequelize-cli db:migrate && npm start"

  # Worker Process 1
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-ai-worker-1
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      REDIS_DB: 0
      GEMINI_MAX_RPS: 3
      GEMINI_MAX_BURST: 5
      GEMINI_BASE_DELAY: 60000
      GEMINI_MAX_DELAY: 30000
      GEMINI_MAX_RETRIES: 5
      CHAT_WORKER_CONCURRENCY: 5
      WHATSAPP_WORKER_CONCURRENCY: 10
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - whatsapp-network
    command: node src/workers/worker-process.js --worker-id=1

  # Worker Process 2
  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-ai-worker-2
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      REDIS_DB: 0
      GEMINI_MAX_RPS: 3
      GEMINI_MAX_BURST: 5
      GEMINI_BASE_DELAY: 60000
      GEMINI_MAX_DELAY: 30000
      GEMINI_MAX_RETRIES: 5
      CHAT_WORKER_CONCURRENCY: 5
      WHATSAPP_WORKER_CONCURRENCY: 10
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - whatsapp-network
    command: node src/workers/worker-process.js --worker-id=2

  # Redis UI (Optional - for debugging queues)
  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - whatsapp-network

volumes:
  redis-data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
